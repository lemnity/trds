# Production-окружение (architecture.md §15). Запуск: см. README.md.
# PostgreSQL — только во внутренней сети backend без опубликованных портов.
name: trds

x-app-env: &app-env
  DATABASE_URL: postgres://trds:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}@postgres:5432/trds
  PAYLOAD_SECRET: ${PAYLOAD_SECRET:?задайте PAYLOAD_SECRET в .env}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Файлы состояния на общем томе ops-state: heartbeat worker и итог бэкапа (/api/health, T-015).
  WORKER_HEARTBEAT_FILE: /app/state/worker-heartbeat.json
  BACKUP_STATUS_FILE: /app/state/backup-status.json

services:
  postgres:
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: trds
      POSTGRES_DB: trds
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trds -d trds']
      interval: 10s
      timeout: 5s
      retries: 6

  app:
    image: trds-app:local
    build: .
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ops-state:/app/state:ro
    # edge — исходящий доступ к API банка/почты и вход от caddy.
    networks:
      - backend
      - edge
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: trds-app:local
    build: .
    restart: unless-stopped
    command: ['node', 'worker.mjs']
    environment:
      <<: *app-env
      WORKER_TICK_MS: ${WORKER_TICK_MS:-300000}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ops-state:/app/state
    networks:
      - backend
      - edge

  # Ежедневный pg_dump + архив медиа (scripts/backup.sh, docs/runbook.md). Тот же образ PostgreSQL —
  # pg_dump той же версии, что и сервер. Только внутренняя сеть: внешняя копия в S3 — заглушка,
  # для неё понадобится edge после выбора провайдера.
  backup:
    image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    entrypoint: ['bash', '/scripts/backup-scheduler.sh']
    environment:
      PGHOST: postgres
      PGUSER: trds
      PGDATABASE: trds
      PGPASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      BACKUP_DIR: /backups
      BACKUP_AT: ${BACKUP_AT:-00:30}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_STATUS_FILE: /app/state/backup-status.json
      BACKUP_OFFSITE_TARGET: ${BACKUP_OFFSITE_TARGET:-}
    volumes:
      - ./scripts:/scripts:ro
      - backups:/backups
      - ops-state:/app/state
    depends_on:
      postgres:
        condition: service_healthy
      # Том ops-state первым монтирует образ приложения: каталог /app/state принадлежит nextjs.
      worker:
        condition: service_started
    networks:
      - backend

  caddy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?задайте SITE_DOMAIN в .env}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-31536000}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - edge

networks:
  backend:
    internal: true
  edge: {}

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  # Локальные копии БД; хранить на другом диске/хосте — см. docs/runbook.md.
  backups:
  ops-state:
